name: Auto Post
on:
  workflow_dispatch:
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run Bot
        run: python main.py morning
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
